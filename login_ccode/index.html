<!doctype html>
<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Login</title>
<!-- Student login: name + password, password = the name again. Mike 2026-10-14.
     The roster is stored as SHA-256 hashes of the lowercased names so names are not readable in the page source.
     Login state lives in this browser only; shared iPads log out after 30 idle minutes. -->
<style>
  :root { --bg:#fff; --fg:#1d1d1f; --muted:#666; --btn:#1a6dd6; --line:#c8c8cc; --ok:#1e8e3e; --bad:#c5221f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --muted:#aaa; --btn:#4a90e2; --line:#444; --ok:#4cc26a; --bad:#ff6b5e; } }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,sans-serif;
         min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
         padding:16px; box-sizing:border-box; text-align:center; }
  h1 { font-size:2rem; margin:0 0 24px; }
  form, #done { width:100%; max-width:420px; }
  label { display:block; text-align:left; font-size:1.3rem; margin:16px 0 6px; }
  input { width:100%; box-sizing:border-box; font-size:1.5rem; padding:14px; border:2px solid var(--line);
          border-radius:12px; background:var(--bg); color:var(--fg); }
  button, .go { display:inline-block; font-size:1.5rem; padding:18px 40px; margin-top:28px; border:0; border-radius:16px;
                background:var(--btn); color:#fff; cursor:pointer; touch-action:manipulation; text-decoration:none; }
  .link { background:none; color:var(--btn); font-size:1.2rem; padding:8px; margin-top:16px; text-decoration:underline; }
  #msg { font-size:1.3rem; margin-top:20px; min-height:1.6rem; color:var(--bad); }
  #hi { font-size:2.2rem; font-weight:700; color:var(--ok); margin:0 0 8px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<form id="form" autocomplete="off" novalidate>
  <h1>Student Login</h1>
  <label for="name">Name</label>
  <input id="name" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" required>
  <label for="pass">Password</label>
  <input id="pass" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" required>
  <button type="submit">Log in</button>
  <div id="msg" role="alert" aria-live="polite"></div>
</form>
<div id="done" hidden>
  <p id="hi"></p>
  <a class="go" href="../">Go to lessons</a><br>
  <button id="out" class="link" type="button"></button>
</div>

const IDLE_MS = 30 * 60 * 1000;
const $ = id => document.getElementById(id);

function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

async function sha256(s) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}

function showDone(name) {
  $("form").hidden = true; $("done").hidden = false;
  $("hi").textContent = "Hi, " + name + "!";
  $("out").textContent = "Not " + name + "? Log out";
}

function showForm() {
  $("done").hidden = true; $("form").hidden = false;
  $("name").value = ""; $("pass").value = ""; $("msg").textContent = "";
}

$("form").addEventListener("submit", async ev => {
  ev.preventDefault();
  const typed = $("name").value.trim(), pass = $("pass").value.trim();
  if (!typed || !pass) { $("msg").textContent = "Type your name and password."; return; }
  const ok = pass.toLowerCase() === typed.toLowerCase() && ROSTER.has(await sha256(typed.toLowerCase()));
  if (!ok) { $("msg").textContent = "Name or password is wrong. Try again."; return; }
  const name = typed.charAt(0).toUpperCase() + typed.slice(1);
  store("student", name); store("studentSeen", String(Date.now()));
  showDone(name);
});

$("out").addEventListener("click", () => { store("student", null); store("studentSeen", null); showForm(); });

const saved = load("student"), seen = Number(load("studentSeen") || 0);
if (saved && Date.now() - seen < IDLE_MS) { store("studentSeen", String(Date.now())); showDone(saved); }
else { store("student", null); store("studentSeen", null); }
</script>
